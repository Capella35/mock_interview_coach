[project]
name = "interview-agent"
version = "0.1.0"
description = "Interview Agent — role-neutral interview prep. Milestone 1: document ingestion, sourced Fact Sheet, Match/Gap Map"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "pydantic>=2.7,<3",
    "pypdf>=7.0.1",
]

[project.scripts]
interview-agent = "interview_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
